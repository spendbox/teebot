<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teebot - offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0b0b14; color: #eceef2;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 22px; margin: 18px 0 6px; }
  p { color: #9aa0b4; margin: 0 0 22px; max-width: 320px; }
  button { font: inherit; font-weight: 650; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px;
    background: linear-gradient(135deg, #6366f1, #a855f7); cursor: pointer; }
</style>
</head>
<body>
  <div>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Your bot keeps running on the server. Reconnect to the internet to see the latest.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
